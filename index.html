<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Теплокарта взгляда</title>
<script src="webgazer.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
  #startBtn { padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 20px; }
  #startBtn:hover { background: #45a049; }
  #imageContainer { position: relative; display: inline-block; margin-top: 20px; }
  #targetImage { max-width: 90vw; max-height: 70vh; display: block; }
  #dot { position: absolute; width: 20px; height: 20px; background: red; border-radius: 50%; opacity: 0.6; pointer-events: none; display: none; transform: translate(-50%, -50%); }
  #status { font-size: 16px; color: #333; margin: 15px; }
  #saveBtn { padding: 12px 25px; font-size: 16px; background: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 20px; display: none; }
  #uploadBox { margin: 20px; padding: 20px; border: 2px dashed #999; border-radius: 10px; background: white; display: inline-block; }
</style>
</head>
<body>

<h1>Теплокарта взгляда</h1>

<div id="uploadBox">
  <p><b>Шаг 1.</b> Загрузите изображение для теста:</p>
  <input type="file" id="imageInput" accept="image/*">
</div>

<button id="startBtn">Шаг 2. Начать отслеживание взгляда</button>

<div id="status"></div>

<div id="imageContainer">
  <img id="targetImage" src="" alt="">
  <div id="dot"></div>
</div>

<button id="saveBtn">Шаг 3. Сохранить данные (CSV)</button>

<script>
let gazeData = [];
let tracking = false;
let startTime = 0;
let imageElement = document.getElementById('targetImage');
let dot = document.getElementById('dot');
let status = document.getElementById('status');
let startBtn = document.getElementById('startBtn');
let saveBtn = document.getElementById('saveBtn');
let imageInput = document.getElementById('imageInput');

imageInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      imageElement.src = ev.target.result;
      status.textContent = 'Изображение загружено. Нажмите "Начать отслеживание".';
    };
    reader.readAsDataURL(file);
  }
});

startBtn.addEventListener('click', async function() {
  if (!imageElement.src || imageElement.src === window.location.href) {
    alert('Сначала загрузите изображение!');
    return;
  }

  status.textContent = 'Запуск камеры... Разрешите доступ в браузере.';

  try {
    await webgazer.setGazeListener(function(data, elapsedTime) {
      if (data == null) return;
      if (!tracking) return;

      const rect = imageElement.getBoundingClientRect();
      const x = data.x - rect.left;
      const y = data.y - rect.top;

      if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
        const timestamp = Date.now() - startTime;
        gazeData.push({ x: Math.round(x), y: Math.round(y), t: timestamp });

        dot.style.display = 'block';
        dot.style.left = (data.x) + 'px';
        dot.style.top = (data.y) + 'px';
      }
    }).begin();

    webgazer.showVideoPreview(true).showPredictionPoints(false);
    webgazer.applyKalmanFilter(true);

    tracking = true;
    startTime = Date.now();
    gazeData = [];

    status.textContent = 'Калибровка: смотрите на точки и кликайте по ним. Затем смотрите на изображение.';
    startBtn.style.display = 'none';
    saveBtn.style.display = 'inline-block';

  } catch (err) {
    status.textContent = 'Ошибка: ' + err.message + '. Убедитесь, что камера разрешена.';
  }
});

saveBtn.addEventListener('click', function() {
  tracking = false;
  webgazer.pause();

  if (gazeData.length === 0) {
    alert('Нет данных для сохранения.');
    return;
  }

  let csv = 'x,y,time_ms\n';
  gazeData.forEach(function(p) {
    csv += p.x + ',' + p.y + ',' + p.t + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'gaze_data_' + Date.now() + '.csv';
  link.click();

  status.textContent = 'Данные сохранены! Файл CSV скачан. Отправьте его исследователю.';
});
</script>

</body>
</html>
